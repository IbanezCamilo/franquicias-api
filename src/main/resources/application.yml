spring:
  application:
    name: franquicias-api

  mongodb:
    # En local apunta a la instancia de docker-compose; en la nube se inyecta MONGODB_URI.
    uri: ${MONGODB_URI:mongodb://localhost:27017/franquicias}
    representation:
      # Representacion estandar de UUID. Sin esto el driver se niega a codificar los
      # identificadores, porque el formato legado de Java es ambiguo entre lenguajes.
      uuid: standard

  data:
    mongodb:
      # Crea los indices declarados en los documentos al arrancar, incluido el unico
      # sobre el nombre normalizado de la franquicia.
      auto-index-creation: true

server:
  # Render inyecta el puerto por la variable PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Solo health e info quedan expuestos; el resto permanece cerrado.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.franquicias.api: INFO
